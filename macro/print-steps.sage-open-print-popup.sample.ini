[Settings]
; Use this version when the small Sage print popup is already open.
; The title should match the popup that says "Print Glebe No Label Stock Label".
WindowTitle=Print Glebe No Label Stock Label
DelayMs=700

[Steps]
; Replace FROM_X/FROM_Y and OK_X/OK_Y with coordinates captured by Copy click.
; This clicks the "from" page box, types the page number, tabs to "to",
; types the same page number, then presses Enter to print.
1=click|FROM_X|FROM_Y
2=send|^a
3=text|{label}
4=send|{Tab}
5=send|^a
6=text|{label}
7=sleep|300
8=send|{Enter}
9=sleep|3000
