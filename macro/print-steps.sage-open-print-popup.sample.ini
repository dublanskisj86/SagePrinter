[Settings]
; Use this version when the Sage label preview is open.
; The macro opens the small Sage print popup for every page/copy.
WindowTitle=Sage 200
DelayMs=800
ConfirmBeforeRun=false
ShowCompleteMessage=false
UsePrinterCopies=true

[Steps]
; Replace FROM_X/FROM_Y, TO_X/TO_Y, and OK_X/OK_Y with coordinates captured by
; Copy click while the Sage print popup is visible. Replace COPIES_X/COPIES_Y
; with the coordinate for the Number of copies box.
1=send|^p
2=waitwin|Print Glebe No Label Stock Label
3=sleep|500
4=activate|Print Glebe No Label Stock Label
5=click|COPIES_X|COPIES_Y
6=send|^a
7=text|{copies}
8=click|FROM_X|FROM_Y
9=send|^a
10=text|{label}
11=click|TO_X|TO_Y
12=send|^a
13=text|{label}
14=sleep|300
15=click|OK_X|OK_Y
16=sleep|5000
