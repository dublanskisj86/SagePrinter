[Settings]
; Use F10 while the macro is running to copy the exact active Sage window title.
WindowTitle=Sage 200

; Wait after every step. Increase this if Sage or the printer dialog is slow.
DelayMs=300

; Set these to false after the dry-run/order test if you do not want macro
; confirmation popups while printing.
ConfirmBeforeRun=true
ShowCompleteMessage=true

; Set this to true if the steps type {copies} into the printer's copy-count
; field. When true, each page is printed once with that printer copy count
; instead of repeating the whole step once per label copy.
UsePrinterCopies=false

[Steps]
; These are example steps only. Replace them with the actions required to print
; one label from your Sage screen.
;
; Common commands:
;   send|^p          Ctrl+P
;   send|!p          Alt+P
;   send|{Enter}    Enter
;   text|{label}    type the current pallet label
;   text|{copies}   type the Labels per pallet value
;   click|420|310   click screen coordinate 420,310
;   sleep|500       wait 500 milliseconds
;
; In the no-install PowerShell macro, use the Copy click button to copy a mouse
; coordinate as a click step. It waits 3 seconds, so click the button and then
; move the mouse over the Sage field you want to click. Use Copy title to copy
; the active window title.
;
; In the optional AutoHotkey macro, F9 copies the current mouse coordinate and
; F10 copies the active window title.
;
1=tooltip|Printing {label}
2=send|^p
3=sleep|500
4=text|{label}
5=send|{Enter}
